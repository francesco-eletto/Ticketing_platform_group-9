openapi: 3.1.0
info:
  title: Ticketing Platform Payments API contract
  description: RESTful API for the Payments microservice of the Ticketing platform.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1           # temporaneo
    description: Payments API Gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: object
      description: Monetary value object.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: The amount represented as a string for exact decimal precision.
        currency:
          type: string
          description: ISO 4217 currency code.

    TransactionRequest:
      type: object
      description: Payload sent by Inventory & Orders to initialize a payment transaction.
      required:
        - id_order
        - amount
      additionalProperties: false
      properties:
        id_order:
          type: string
          description: The ID of the order just created in PENDING status.
        amount:
          $ref: '#/components/schemas/Money'
            
    TransactionResponse:
      type: object
      description: Response returned to redirect the user to the payment gateway.
      required:
        - id_transaction
        - payment_url
        - status
      properties:
        id_transaction:
          type: string
          description: The ID of the transaction created in the Payments database.
        payment_url:
          type: string
          description: URL of the external gateway to redirect the user.
        status:
          type: string
          description: Initial status of the transaction.
          
    WebhookPayload:
      type: object
      description: Payload sent by the external payment gateway.
      required:
        - idempotency_key
        - id_order
        - status
        - amount
      additionalProperties: true
      properties:
        idempotency_key:
          type: string
          description: Unique key sent by the provider to prevent processing the same payment twice.
        id_order:
          type: string
          description: The order associated with this transaction.
        status:
          type: string
          description: Outcome of the payment (e.g., PAID, DECLINED).
        amount:
          $ref: '#/components/schemas/Money'

    ProblemDetail:
      type: object
      description: Standard RFC 9457 model for API error responses.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: A URI that identifies the problem type.
        title:
          type: string
          description: A short summary of the problem.
        status:
          type: integer
          description: The HTTP status code generated by the server.
        detail:
          type: string
          description: An explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
        code:
          type: string
          description: Application-specific error code for handling.
        errors:
          type: array
          description: Array of field-level errors.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: Details of a field-level validation failure.
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
          description: The field that failed validation.
        code:
          type: string
          description: The specific error code for this field.
        detail:
          type: string
          description: An explanation of the error.

paths:
  /transactions:
    post:
      summary: Initialize Payment Transaction
      description: Called internally by Inventory & Orders to create the transaction and generate the external Gateway intent.
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              id_order: "12345"
              amount:
                amount: "120.50"
                currency: "EUR"
      responses:
        '201':
          description: Transaction successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              example:
                id_transaction: "778899"
                payment_url: "https://checkout.stripe.com/pay/cs_test_12345"
                status: "PENDING"
        '400':
          description: Malformed request JSON structure or invalid types.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Malformed JSON request."
                instance: "/transactions"
                code: "bad_request"
        '422':
          description: Unprocessable Content - Semantic validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8082/errors/validation-failed"
                title: "Validation Failed"
                status: 422
                detail: "Invalid amount format."
                instance: "/transactions"
                code: "validation_failed"
                errors:
                  - field: "amount"
                    code: "invalid_format"
                    detail: "The amount must be a valid decimal string."
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8082/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected internal error occurred."
                instance: "/transactions"
                code: "internal_server_error"
                
  /webhook:
    post:
      summary: Receive Payment Confirmation
      description: Endpoint called by the external payment provider to communicate the transaction outcome.
      operationId: processPaymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
            example:
              idempotency_key: "tx-stripe-123456789"
              id_order: "12345"
              status: "PAID"
              amount:
                amount: "120.50"
                currency: "EUR"
      responses:
        '200':
          description: Webhook received and processed (or ignored if duplicate).
        '400':
          description: Invalid payload or missing fields.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Missing idempotency_key in payload."
                instance: "/webhook"
                code: "bad_request"
        '422':
          description: Unprocessable Content - Semantic validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8082/errors/validation-failed"
                title: "Validation Failed"
                status: 422
                detail: "Invalid status format."
                instance: "/webhook"
                code: "validation_failed"
                errors:
                  - field: "status"
                    code: "invalid_status"
                    detail: "The status must be PAID, DECLINED or PENDING."
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8082/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected internal error occurred."
                instance: "/webhook"
                code: "internal_server_error"