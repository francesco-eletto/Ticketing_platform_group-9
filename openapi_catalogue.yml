openapi: 3.1.0
info:
  title: Ticketing Platform Catalogue API contract
  description: Contratti API RESTful per il microservizio Catalogue della piattaforma di Ticketing.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1         # temporaneo
    description: Catalogue API Gateway

paths:
  /events:
    get:
      summary: Recupero Lista Eventi
      description: Restituisce l'elenco di tutti gli eventi disponibili a catalogo per essere mostrati nella pagina principale.
      operationId: getEventsList
      responses:
        '200':
          description: Lista degli eventi recuperata con successo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
              example:
                - id_event: 4711
                  name: "Concerto Rock Live"
                  date: "2026-12-15"
                  start_time: "21:00:00"
                  end_time: "23:30:00"
                  thumbnail_path: "/images/events/rock_live_4711.jpg"
                - id_event: 4712
                  name: "Spettacolo Teatrale - Amleto"
                  date: "2026-12-20"
                  start_time: "20:30:00"
                  end_time: "23:00:00"
                  thumbnail_path: "/images/events/amleto_4712.jpg"
        '500':
          description: Errore interno del server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "Database connection failed while retrieving events."
                instance: "/events"

  /events/{id_event}:
    get:
      summary: Esplorazione Singolo Evento
      description: Restituisce i dettagli di uno specifico evento e la lista dei settori disponibili con i relativi prezzi.
      operationId: getEventDetailsById
      parameters:
        - name: id_event
          in: path
          description: ID dell'evento da recuperare.
          required: true
          schema:
            type: integer
            example: 4711
      responses:
        '200':
          description: Dettagli dell'evento e configurazione dei settori restituiti con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetails'
              example:
                id_event: 4711
                name: "Concerto Rock Live"
                date: "2026-12-15"
                start_time: "21:00:00"
                end_time: "23:30:00"
                thumbnail_path: "/images/events/rock_live_4711.jpg"
                sectors:
                  - id_sector: 101
                    sector_label: "Parterre in piedi"
                    capacity: 5000
                    price: 4550
                  - id_sector: 102
                    sector_label: "Tribuna numerata"
                    capacity: 2500
                    price: 7500
        '404':
          description: Evento non trovato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/event-not-found"
                title: "Event Not Found"
                status: 404
                detail: "Event with ID 4711 not found in the catalogue."
                instance: "/events/4711"
        '400':
          description: Richiesta malformata.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid format for id_event parameter. Expected integer."
                instance: "/events/abc"
        '500':
          description: Errore interno del server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "Database query execution failed."
                instance: "/events/4711"

components:
  schemas:
    EventSummary:
      type: object
      description: Struttura dati contenente le informazioni base di un evento.
      properties:
        id_event:
          type: integer
          description: Identificativo dell'evento.
        name:
          type: string
          description: Nome completo dell'evento.
        date:
          type: string
          format: date
          description: Data in cui si terrà l'evento.
        start_time:
          type: string
          format: time
          description: Orario di inizio ufficiale dell'evento.
        end_time:
          type: string
          format: time
          description: Orario di fine previsto per l'evento.
        thumbnail_path:
          type: string
          description: Percorso logico dell'immagine di copertina dell'evento.
          
    EventDetails:
      type: object
      description: Dettagli completi di un evento, inclusa la configurazione dei settori e i prezzi associati.
      properties:
        id_event:
          type: integer
          description: Identificativo dell'evento.
        name:
          type: string
          description: Nome completo dell'evento.
        date:
          type: string
          format: date
          description: Data in cui si terrà l'evento.
        start_time:
          type: string
          format: time
          description: Orario di inizio.
        end_time:
          type: string
          format: time
          description: Orario di fine previsto.
        thumbnail_path:
          type: string
          description: Percorso logico dell'immagine di copertina.
        sectors:
          type: array
          description: Array contenente tutti i settori disponibili per questo evento.
          items:
            $ref: '#/components/schemas/SectorPrice'
            
    SectorPrice:
      type: object
      description: Struttura dati che unisce le informazioni di un settore con il prezzo stabilito per uno specifico evento.
      properties:
        id_sector:
          type: integer
          description: Identificativo del settore.
        sector_label:
          type: string
          description: Nome del settore per la mappa.
        capacity:
          type: integer
          description: Capienza massima in questo specifico settore.
        price:
          type: integer
          description: "Costo del biglietto per questo settore espresso in centesimi."

    ProblemDetail:
      type: object
      description: Modello standard RFC 7807 per la restituzione degli errori da parte delle API.
      properties:
        type:
          type: string
          description: URI che identifica il tipo di problema.
        title:
          type: string
          description: Un riassunto breve e leggibile del problema.
        status:
          type: integer
          description: Il codice di stato HTTP generato dal server.
        detail:
          type: string
          description: Una spiegazione specifica e dettagliata di questa occorrenza del problema.
        instance:
          type: string
          description: Un URI che identifica l'occorrenza specifica dell'errore.