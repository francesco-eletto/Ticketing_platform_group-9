openapi: 3.1.0
info:
  title: Ticketing Platform Catalogue API contract
  description: RESTful API for the Catalogue microservice of the Ticketing platform.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1           # temporaneo
    description: Catalogue API Gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: object
      description: Monetary value object.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: The amount represented as a string for exact decimal precision.
        currency:
          type: string
          description: ISO 4217 currency code.

    EventSummary:
      type: object
      description: Data structure containing basic event information.
      required:
        - id_event
        - name
        - local_start_time
        - venue_tz
        - thumbnail_path
      properties:
        id_event:
          type: string
          description: Unique identifier of the event.
        name:
          type: string
          description: Name of the event.
        local_start_time:
          type: string
          format: date-time
          description: Local start date and time of the event without timezone offset (e.g., 2026-12-15T21:00:00).
        venue_tz:
          type: string
          description: IANA Time Zone name of the venue.
        thumbnail_path:
          type: string
          description: Logical path of the event's cover image.
          
    EventDetails:
      type: object
      description: Complete details of an event, including sector configuration and associated prices.
      required:
        - id_event
        - name
        - local_start_time
        - venue_tz
        - thumbnail_path
        - sectors
      properties:
        id_event:
          type: string
          description: Unique identifier of the event.
        name:
          type: string
          description: Name of the event.
        local_start_time:
          type: string
          format: date-time
          description: Local start date and time of the event without timezone offset.
        venue_tz:
          type: string
          description: IANA Time Zone name of the venue.
        venue_name:
          type: string
          description: Name of the venue hosting the event.
        venue_address:
          type: string
          description: Physical address of the venue.
        thumbnail_path:
          type: string
          description: Logical path of the event's cover image.
        sectors:
          type: array
          description: Array containing all sectors available for this event.
          items:
            $ref: '#/components/schemas/SectorPrice'
            
    SectorPrice:
      type: object
      description: Data structure combining sector information with the price set for a specific event.
      required:
        - id_sector
        - sector_label
        - capacity
        - price
      properties:
        id_sector:
          type: string
          description: Unique identifier of the sector.
        sector_label:
          type: string
          description: Name of the sector for the map.
        capacity:
          type: integer
          description: Maximum capacity in this specific sector.
        price:
          $ref: '#/components/schemas/Money'

    EventListResponse:
      type: object
      description: Paginated response for the event list.
      required:
        - items
        - limit
      properties:
        items:
          type: array
          description: Array of events.
          items:
            $ref: '#/components/schemas/EventSummary'
        next_cursor:
          type: string
          description: Cursor pointing to the next page of results. Omitted if there are no more results.
        limit:
          type: integer
          description: Maximum number of items returned in this page.

    ProblemDetail:
      type: object
      description: Standard RFC 9457 model for API error responses.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: A URI that identifies the problem type.
        title:
          type: string
          description: A short summary of the problem.
        status:
          type: integer
          description: The HTTP status code generated by the server.
        detail:
          type: string
          description: An explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
        code:
          type: string
          description: Application-specific error code for programmatic handling.
        errors:
          type: array
          description: Array of field-level errors.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: Details of a field-level validation failure.
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
          description: The field that failed validation.
        code:
          type: string
          description: The specific error code for this field.
        detail:
          type: string
          description: An explanation of the validation error.

paths:
  /events:
    get:
      summary: Retrieve Event List
      description: Returns the list of all available events in the catalogue to be shown on the main page.
      operationId: getEventsList
      security: []
      parameters:
        - name: cursor
          in: query
          description: Cursor for pagination indicating where to resume fetching.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return.
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of events successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              example:
                items:
                  - id_event: "4711"
                    name: "Concerto Rock Live"
                    local_start_time: "2026-12-15T21:00:00"
                    venue_tz: "Europe/Rome"
                    thumbnail_path: "/images/events/rock_live_4711.jpg"
                  - id_event: "4712"
                    name: "Spettacolo Teatrale - Amleto"
                    local_start_time: "2026-12-20T20:30:00"
                    venue_tz: "Europe/Rome"
                    thumbnail_path: "/images/events/amleto_4712.jpg"
                next_cursor: "cursor_abc123"
                limit: 20
        '400':
          description: Malformed request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid limit parameter format."
                instance: "/events"
                code: "bad_request"
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected internal error occurred."
                instance: "/events"
                code: "internal_server_error"

  /events/{id_event}:
    get:
      summary: Explore Single Event
      description: Returns the details of a specific event and the list of available sectors with their prices.
      operationId: getEventDetailsById
      security: []
      parameters:
        - name: id_event
          in: path
          description: ID of the event to retrieve.
          required: true
          schema:
            type: string
            example: "4711"
      responses:
        '200':
          description: Event details and sector configuration successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetails'
              example:
                id_event: "4711"
                name: "Concerto Rock Live"
                local_start_time: "2026-12-15T21:00:00"
                venue_tz: "Europe/Rome"
                venue_name: "Stadio Olimpico Grande Torino"
                venue_address: "Via Filadelfia 96, 10134 Torino TO, Italy"
                thumbnail_path: "/images/events/rock_live_4711.jpg"
                sectors:
                  - id_sector: "101"
                    sector_label: "Parterre in piedi"
                    capacity: 5000
                    price:
                      amount: "45.50"
                      currency: "EUR"
                  - id_sector: "102"
                    sector_label: "Tribuna numerata"
                    capacity: 2500
                    price:
                      amount: "75.00"
                      currency: "EUR"
        '404':
          description: Event not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/event-not-found"
                title: "Event Not Found"
                status: 404
                detail: "Event with ID 4711 not found in the catalogue."
                instance: "/events/4711"
                code: "event_not_found"
        '400':
          description: Malformed request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Invalid format for id_event parameter."
                instance: "/events/abc"
                code: "bad_request"
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: "http://localhost:8080/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected internal error occurred."
                instance: "/events/4711"
                code: "internal_server_error"